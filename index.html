<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Budget">
<meta name="theme-color" content="#0f766e">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icon-180.png">
<link rel="icon" href="icon-512.png">
<title>Pocket Budget</title>
<style>
:root{
  /* layout: one-column phone app, sticky tab bar, bottom sheet for forms */
  --bg:#f4f5f2; --card:#ffffff; --ink:#18201e; --muted:#6b7773; --line:#e3e6e2;
  --accent:#0f766e; --accent-ink:#ffffff; --good:#15803d; --bad:#c2410c;
  --font:-apple-system,BlinkMacSystemFont,"SF Pro Text","Segoe UI",Roboto,sans-serif;
  color-scheme:light;
}
@media (prefers-color-scheme:dark){
  :root{--bg:#0e1312;--card:#171e1c;--ink:#eef2f0;--muted:#8e9a96;--line:#27312e;--accent:#2dd4bf;--accent-ink:#06201c;--good:#4ade80;--bad:#fb923c;color-scheme:dark}
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{height:100%;margin:0}
body{background:var(--bg);color:var(--ink);font:16px/1.4 var(--font);font-variant-numeric:tabular-nums;overscroll-behavior:none}
#app{max-width:560px;margin:0 auto;min-height:100%;padding:calc(env(safe-area-inset-top) + 12px) 16px calc(env(safe-area-inset-bottom) + 96px)}
h1{font-size:28px;margin:8px 0 16px;letter-spacing:-.02em}
h2{font-size:13px;text-transform:uppercase;letter-spacing:.06em;color:var(--muted);margin:24px 4px 8px;font-weight:600}
.card{background:var(--card);border-radius:16px;padding:14px 16px;border:1px solid var(--line)}
.row{display:flex;align-items:center;gap:12px}
.grow{flex:1;min-width:0}
.muted{color:var(--muted)} .small{font-size:13px}
.good{color:var(--good)} .bad{color:var(--bad)}
button{font:inherit;color:inherit;background:none;border:0;padding:0;cursor:pointer}
button:focus-visible,input:focus-visible,select:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.month{display:flex;align-items:center;justify-content:space-between;margin-bottom:12px}
.month button{width:44px;height:44px;border-radius:50%;font-size:20px;background:var(--card);border:1px solid var(--line)}
.month strong{font-size:17px}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;text-align:center}
.stats b{display:block;font-size:17px;margin-top:2px}
.donut{display:flex;align-items:center;gap:16px}
.donut svg{width:128px;height:128px;flex:none;transform:rotate(-90deg)}
.legend{display:flex;flex-direction:column;gap:6px;min-width:0}
.legend span{display:flex;align-items:center;gap:8px;font-size:14px}
.dot{width:10px;height:10px;border-radius:50%;flex:none}
.list{display:flex;flex-direction:column;gap:8px}
.item{display:flex;align-items:center;gap:12px;width:100%;text-align:left;background:var(--card);border:1px solid var(--line);border-radius:14px;padding:12px 14px;min-height:56px}
.emoji{width:40px;height:40px;border-radius:12px;display:grid;place-items:center;font-size:20px;flex:none}
.bar{height:8px;border-radius:99px;background:var(--line);overflow:hidden;margin-top:8px}
.bar i{display:block;height:100%;border-radius:99px}
.amt{font-weight:600;white-space:nowrap}
.empty{text-align:center;color:var(--muted);padding:32px 16px}
nav{position:fixed;left:0;right:0;bottom:0;background:color-mix(in srgb,var(--card) 92%,transparent);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom)}
nav div{max-width:560px;margin:0 auto;display:grid;grid-template-columns:1fr 1fr 1fr}
nav button{padding:10px 0 8px;display:flex;flex-direction:column;align-items:center;gap:2px;font-size:11px;color:var(--muted);min-height:56px}
nav button span{font-size:22px;line-height:1}
nav button[aria-current=true]{color:var(--accent);font-weight:600}
.fab{position:fixed;right:20px;bottom:calc(env(safe-area-inset-bottom) + 76px);width:56px;height:56px;border-radius:50%;background:var(--accent);color:var(--accent-ink);font-size:30px;box-shadow:0 6px 18px rgba(0,0,0,.25);display:grid;place-items:center}
.sheet-bg{position:fixed;inset:0;background:rgba(0,0,0,.45);display:flex;align-items:flex-end;justify-content:center;z-index:10}
.sheet{background:var(--bg);width:100%;max-width:560px;max-height:92%;overflow:auto;border-radius:22px 22px 0 0;padding:18px 16px calc(env(safe-area-inset-bottom) + 18px)}
.sheet h3{margin:0 0 14px;font-size:20px}
label{display:block;font-size:13px;color:var(--muted);margin:14px 4px 6px}
input,select{width:100%;font:inherit;color:var(--ink);background:var(--card);border:1px solid var(--line);border-radius:12px;padding:12px;min-height:48px}
input[type=color]{padding:4px;height:48px}
.big{font-size:34px;font-weight:700;text-align:center;letter-spacing:-.02em}
.seg{display:grid;grid-template-columns:1fr 1fr;background:var(--line);border-radius:12px;padding:3px;gap:3px}
.seg button{padding:10px;border-radius:10px;font-weight:600;color:var(--muted)}
.seg button[aria-pressed=true]{background:var(--card);color:var(--ink)}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{padding:8px 12px;border-radius:99px;border:1px solid var(--line);background:var(--card);font-size:14px;min-height:40px}
.chip[aria-pressed=true]{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.actions{display:flex;gap:10px;margin-top:20px}
.btn{flex:1;padding:14px;border-radius:14px;font-weight:600;background:var(--card);border:1px solid var(--line);min-height:48px;text-align:center}
.btn.primary{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.btn.danger{color:var(--bad)}
@media (prefers-reduced-motion:no-preference){.sheet{animation:up .22s ease-out}@keyframes up{from{transform:translateY(40px);opacity:0}}}
</style>
</head>
<body>
<div id="app"></div>
<nav><div id="tabs"></div></nav>
<button class="fab" id="fab" aria-label="Add transaction">+</button>
<div id="modal"></div>

<script>
const KEY = 'pocket-budget-v1';
const $ = s => document.querySelector(s);
const esc = s => String(s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const uid = () => Math.random().toString(36).slice(2, 10);
const pad = n => String(n).padStart(2, '0');
const todayISO = () => { const d = new Date(); return `${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())}`; };
const ym = d => `${d.getFullYear()}-${pad(d.getMonth()+1)}`;

const DEFAULT_CATS = [
  {name:'Groceries', emoji:'🛒', color:'#16a34a', budget:250},
  {name:'Rent', emoji:'🏠', color:'#6366f1', budget:0},
  {name:'Transport', emoji:'🚌', color:'#0ea5e9', budget:60},
  {name:'Eating out', emoji:'🍔', color:'#f59e0b', budget:80},
  {name:'Fun', emoji:'🎮', color:'#a855f7', budget:50},
  {name:'Other', emoji:'📦', color:'#78716c', budget:0}
];
const CURRENCIES = ['EUR','USD','GBP','CHF','SEK','NOK','DKK','PLN','CZK','CAD','AUD','JPY'];

function load() {
  try { const r = localStorage.getItem(KEY); if (r) return JSON.parse(r); } catch (e) {}
  return { currency:'EUR', cats: DEFAULT_CATS.map(c => ({id:uid(), ...c})), tx: [] };
}
function save() { try { localStorage.setItem(KEY, JSON.stringify(S)); } catch (e) {} }

let S = load();
let V = { tab:'overview', month: ym(new Date()) };

const fmt = n => new Intl.NumberFormat(undefined, {style:'currency', currency:S.currency}).format(n);
const catOf = id => S.cats.find(c => c.id === id);
const monthTx = () => S.tx.filter(t => t.date.startsWith(V.month));
const spentIn = (id, list) => list.filter(t => !t.income && t.cat === id).reduce((a, t) => a + t.amt, 0);
const monthLabel = () => { const [y, m] = V.month.split('-').map(Number); return new Date(y, m-1, 1).toLocaleDateString(undefined, {month:'long', year:'numeric'}); };
const shiftMonth = n => { const [y, m] = V.month.split('-').map(Number); V.month = ym(new Date(y, m-1+n, 1)); };

/* ---------- views ---------- */
function monthBar() {
  return `<div class="month"><button data-act="prev" aria-label="Previous month">‹</button><strong>${monthLabel()}</strong><button data-act="next" aria-label="Next month">›</button></div>`;
}

function viewOverview() {
  const tx = monthTx();
  const inc = tx.filter(t => t.income).reduce((a, t) => a + t.amt, 0);
  const exp = tx.filter(t => !t.income).reduce((a, t) => a + t.amt, 0);
  const left = inc - exp;
  const parts = S.cats.map(c => ({c, v: spentIn(c.id, tx)})).filter(p => p.v > 0).sort((a, b) => b.v - a.v);
  const total = parts.reduce((a, p) => a + p.v, 0);
  const R = 50, C = 2 * Math.PI * R;
  let off = 0;
  const arcs = parts.map(p => { const len = p.v / total * C; const s = `<circle cx="64" cy="64" r="${R}" fill="none" stroke="${p.c.color}" stroke-width="20" stroke-dasharray="${len} ${C - len}" stroke-dashoffset="${-off}"/>`; off += len; return s; }).join('');

  let h = `<h1>Overview</h1>${monthBar()}
  <div class="card stats">
    <div><span class="muted small">Income</span><b class="good">${fmt(inc)}</b></div>
    <div><span class="muted small">Spent</span><b>${fmt(exp)}</b></div>
    <div><span class="muted small">Left</span><b class="${left < 0 ? 'bad' : ''}">${fmt(left)}</b></div>
  </div>`;

  if (parts.length) {
    h += `<h2>Where it went</h2><div class="card donut"><svg viewBox="0 0 128 128" role="img" aria-label="Spending by category">${arcs}</svg>
      <div class="legend">${parts.slice(0, 5).map(p => `<span><i class="dot" style="background:${p.c.color}"></i>${esc(p.c.name)} <b>${Math.round(p.v / total * 100)}%</b></span>`).join('')}</div></div>`;
  }

  h += `<h2>Budgets</h2><div class="list">` + S.cats.map(c => {
    const s = spentIn(c.id, tx), over = c.budget > 0 && s > c.budget;
    const pct = c.budget > 0 ? Math.min(100, s / c.budget * 100) : 0;
    return `<div class="item" style="display:block"><div class="row">
      <div class="emoji" style="background:${c.color}22">${esc(c.emoji)}</div>
      <div class="grow">${esc(c.name)}</div>
      <div class="amt ${over ? 'bad' : ''}">${fmt(s)}${c.budget > 0 ? `<span class="muted small"> / ${fmt(c.budget)}</span>` : ''}</div></div>
      ${c.budget > 0 ? `<div class="bar"><i style="width:${pct}%;background:${over ? 'var(--bad)' : c.color}"></i></div>` : ''}</div>`;
  }).join('') + `</div>`;
  return h;
}

function viewTx() {
  const tx = monthTx().sort((a, b) => b.date.localeCompare(a.date));
  let h = `<h1>Transactions</h1>${monthBar()}`;
  if (!tx.length) return h + `<div class="empty">Nothing here yet.<br>Tap + to add your first transaction.</div>`;
  let day = '';
  h += `<div class="list">`;
  for (const t of tx) {
    if (t.date !== day) {
      day = t.date;
      const [y, m, d] = day.split('-').map(Number);
      h += `<h2 style="margin:12px 4px 0">${new Date(y, m-1, d).toLocaleDateString(undefined, {weekday:'long', day:'numeric', month:'short'})}</h2>`;
    }
    const c = catOf(t.cat);
    h += `<button class="item" data-act="edit-tx" data-id="${t.id}">
      <div class="emoji" style="background:${(c ? c.color : '#888')}22">${c ? esc(c.emoji) : '❔'}</div>
      <div class="grow">${esc(t.note || (c ? c.name : 'Uncategorised'))}<div class="muted small">${c ? esc(c.name) : 'Uncategorised'}</div></div>
      <div class="amt ${t.income ? 'good' : ''}">${t.income ? '+' : '−'}${fmt(t.amt)}</div></button>`;
  }
  return h + `</div>`;
}

function viewCats() {
  return `<h1>Categories</h1><div class="list">` + S.cats.map(c => `
    <button class="item" data-act="edit-cat" data-id="${c.id}">
      <div class="emoji" style="background:${c.color}22">${esc(c.emoji)}</div>
      <div class="grow">${esc(c.name)}<div class="muted small">${c.budget > 0 ? fmt(c.budget) + ' / month' : 'No budget'}</div></div>
      <span class="muted">›</span></button>`).join('') + `</div>
    <div class="actions"><button class="btn primary" data-act="add-cat">Add category</button></div>
    <h2>Settings</h2>
    <div class="card"><label for="cur" style="margin-top:0">Currency</label>
      <select id="cur">${CURRENCIES.map(c => `<option ${c === S.currency ? 'selected' : ''}>${c}</option>`).join('')}</select></div>
    <h2>Backup</h2>
    <div class="card"><p class="muted small" style="margin-top:0">Data is stored only on this device. Export a backup now and then.</p>
      <div class="actions" style="margin-top:0"><button class="btn" data-act="export">Export</button><button class="btn" data-act="import">Import</button></div>
      <input type="file" id="file" accept="application/json" hidden></div>`;
}

const TABS = [['overview','📊','Overview'],['tx','🧾','Transactions'],['cats','🗂️','Categories']];
function render() {
  $('#tabs').innerHTML = TABS.map(([k, i, l]) => `<button data-tab="${k}" aria-current="${V.tab === k}"><span>${i}</span>${l}</button>`).join('');
  $('#app').innerHTML = V.tab === 'overview' ? viewOverview() : V.tab === 'tx' ? viewTx() : viewCats();
  $('#fab').style.display = V.tab === 'cats' ? 'none' : 'grid';
}

/* ---------- sheets ---------- */
function openSheet(html) { $('#modal').innerHTML = `<div class="sheet-bg" data-act="close-bg"><div class="sheet" role="dialog" aria-modal="true">${html}</div></div>`; }
function closeSheet() { $('#modal').innerHTML = ''; }

function txSheet(id) {
  const t = id ? S.tx.find(x => x.id === id) : { income:false, amt:'', cat:S.cats[0] && S.cats[0].id, note:'', date:todayISO() };
  let income = t.income, cat = t.cat;
  openSheet(`<h3>${id ? 'Edit transaction' : 'New transaction'}</h3>
    <div class="seg"><button data-k="exp" aria-pressed="${!income}">Expense</button><button data-k="inc" aria-pressed="${income}">Income</button></div>
    <label for="amt">Amount</label><input id="amt" class="big" inputmode="decimal" placeholder="0.00" value="${t.amt}" autocomplete="off">
    <label>Category</label><div class="chips" id="chips">${S.cats.map(c => `<button class="chip" data-cat="${c.id}" aria-pressed="${c.id === cat}">${esc(c.emoji)} ${esc(c.name)}</button>`).join('')}</div>
    <label for="note">Note</label><input id="note" value="${esc(t.note)}" placeholder="Optional" autocomplete="off">
    <label for="date">Date</label><input id="date" type="date" value="${t.date}">
    <div class="actions">${id ? '<button class="btn danger" id="del">Delete</button>' : ''}<button class="btn" id="cancel">Cancel</button><button class="btn primary" id="ok">Save</button></div>`);
  const m = $('#modal');
  m.querySelectorAll('.seg button').forEach(b => b.onclick = () => { income = b.dataset.k === 'inc'; m.querySelectorAll('.seg button').forEach(x => x.setAttribute('aria-pressed', x === b)); });
  m.querySelectorAll('.chip').forEach(b => b.onclick = () => { cat = b.dataset.cat; m.querySelectorAll('.chip').forEach(x => x.setAttribute('aria-pressed', x === b)); });
  $('#cancel').onclick = closeSheet;
  if (id) $('#del').onclick = () => { S.tx = S.tx.filter(x => x.id !== id); save(); closeSheet(); render(); };
  $('#ok').onclick = () => {
    const amt = parseFloat(String($('#amt').value).replace(',', '.'));
    if (!(amt > 0)) { $('#amt').focus(); return; }
    const rec = { id: id || uid(), amt: Math.round(amt * 100) / 100, income, cat, note: $('#note').value.trim(), date: $('#date').value || todayISO() };
    if (id) S.tx = S.tx.map(x => x.id === id ? rec : x); else S.tx.push(rec);
    V.month = rec.date.slice(0, 7);
    save(); closeSheet(); render();
  };
  if (!id) $('#amt').focus();
}

function catSheet(id) {
  const c = id ? catOf(id) : { name:'', emoji:'⭐', color:'#0f766e', budget:0 };
  openSheet(`<h3>${id ? 'Edit category' : 'New category'}</h3>
    <label for="cn">Name</label><input id="cn" value="${esc(c.name)}" autocomplete="off">
    <label for="ce">Emoji</label><input id="ce" value="${esc(c.emoji)}" maxlength="4">
    <label for="cc">Colour</label><input id="cc" type="color" value="${c.color}">
    <label for="cb">Monthly budget (0 for none)</label><input id="cb" inputmode="decimal" value="${c.budget}">
    <div class="actions">${id ? '<button class="btn danger" id="del">Delete</button>' : ''}<button class="btn" id="cancel">Cancel</button><button class="btn primary" id="ok">Save</button></div>`);
  $('#cancel').onclick = closeSheet;
  if (id) $('#del').onclick = () => {
    const n = S.tx.filter(t => t.cat === id).length;
    if (n && !$('#del').dataset.sure) { $('#del').dataset.sure = 1; $('#del').textContent = `Delete (${n} transactions keep no category)`; return; }
    S.cats = S.cats.filter(x => x.id !== id); save(); closeSheet(); render();
  };
  $('#ok').onclick = () => {
    const name = $('#cn').value.trim(); if (!name) { $('#cn').focus(); return; }
    const rec = { id: id || uid(), name, emoji: $('#ce').value.trim() || '⭐', color: $('#cc').value, budget: Math.max(0, parseFloat(String($('#cb').value).replace(',', '.')) || 0) };
    if (id) S.cats = S.cats.map(x => x.id === id ? rec : x); else S.cats.push(rec);
    save(); closeSheet(); render();
  };
}

/* ---------- events ---------- */
document.addEventListener('click', e => {
  const tab = e.target.closest('[data-tab]'); if (tab) { V.tab = tab.dataset.tab; render(); window.scrollTo(0, 0); return; }
  if (e.target.closest('#fab')) return txSheet();
  if (e.target.matches('.sheet-bg')) return closeSheet();
  const a = e.target.closest('[data-act]'); if (!a) return;
  const act = a.dataset.act, id = a.dataset.id;
  if (act === 'prev') { shiftMonth(-1); render(); }
  else if (act === 'next') { shiftMonth(1); render(); }
  else if (act === 'edit-tx') txSheet(id);
  else if (act === 'edit-cat') catSheet(id);
  else if (act === 'add-cat') catSheet();
  else if (act === 'export') {
    const blob = new Blob([JSON.stringify(S, null, 2)], {type:'application/json'});
    const link = document.createElement('a'); link.href = URL.createObjectURL(blob); link.download = `pocket-budget-${todayISO()}.json`; link.click();
  }
  else if (act === 'import') $('#file').click();
});
document.addEventListener('change', e => {
  if (e.target.id === 'cur') { S.currency = e.target.value; save(); render(); }
  if (e.target.id === 'file' && e.target.files[0]) {
    e.target.files[0].text().then(txt => {
      try { const d = JSON.parse(txt); if (!Array.isArray(d.cats) || !Array.isArray(d.tx)) throw 0; S = d; save(); render(); }
      catch (err) { alert('That file is not a Pocket Budget backup.'); }
    });
  }
});

render();
if ('serviceWorker' in navigator) navigator.serviceWorker.register('sw.js').catch(() => {});
</script>
</body>
</html>
